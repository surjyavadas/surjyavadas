<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Surjyava Das - Software Engineer, AI/ML Engineer, Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .s{animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
  .fu{animation:fu 1.4s ease-out both}
  @keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.s,.fu{animation:none;opacity:.8}}
</style>
<defs>
  <clipPath id="c"><rect width="1000" height="300" rx="18"/></clipPath>
  <filter id="b40" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1400" height="700"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="b14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="b3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="sh" x="-10%" y="-30%" width="120%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".85"/></filter>
  <linearGradient id="iri" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff3b3b"/><stop offset=".17" stop-color="#ffd21a"/>
    <stop offset=".34" stop-color="#46e03c"/><stop offset=".51" stop-color="#36c8ff"/>
    <stop offset=".68" stop-color="#4a55ff"/><stop offset=".84" stop-color="#ff2fa0"/>
    <stop offset="1" stop-color="#ff3b3b"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#9fe8ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="streak" gradientUnits="userSpaceOnUse" x1="830" y1="150" x2="995" y2="8">
    <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="dim" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity=".5"/><stop offset=".7" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
</defs>
<g clip-path="url(#c)">
  <rect width="1000" height="300" fill="#000"/>

  <!-- rainbow nebula -->
  <g filter="url(#b40)" opacity=".9">
    <ellipse cx="60" cy="50" rx="150" ry="100" fill="#ffd21a"><animateTransform attributeName="transform" type="translate" values="0 0;30 15;0 0" dur="12s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="20" cy="150" rx="120" ry="80" fill="#ff7a00"><animateTransform attributeName="transform" type="translate" values="0 0;25 -20;0 0" dur="10s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="90" cy="285" rx="180" ry="70" fill="#c4000a"><animateTransform attributeName="transform" type="translate" values="0 0;40 -10;0 0" dur="14s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="190" cy="150" rx="90" ry="55" fill="#2a3dff" opacity=".8"><animateTransform attributeName="transform" type="translate" values="0 0;-20 20;0 0" dur="9s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="340" cy="262" rx="140" ry="55" fill="#46e03c"><animateTransform attributeName="transform" type="translate" values="0 0;-30 -10;0 0" dur="11s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="400" cy="170" rx="110" ry="60" fill="#36c8ff"><animateTransform attributeName="transform" type="translate" values="0 0;20 15;0 0" dur="13s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="540" cy="290" rx="80" ry="40" fill="#ff2fa0"/>
  </g>
  <polygon points="810,165 540,90 540,240" fill="url(#beam)" filter="url(#b14)" opacity=".4"/>
  <rect width="1000" height="300" fill="url(#dim)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="s" cx="640" cy="40" r="1.2" style="animation-delay:-1s"/><circle class="s" cx="700" cy="250" r="1" style="animation-delay:-2s;animation-duration:5s"/>
    <circle class="s" cx="930" cy="90" r="1.4" style="animation-delay:-.5s"/><circle class="s" cx="960" cy="220" r="1" style="animation-delay:-3s;animation-duration:3.4s"/>
    <circle class="s" cx="880" cy="270" r="1.2" style="animation-delay:-1.6s"/><circle class="s" cx="760" cy="30" r="1" style="animation-delay:-2.4s;animation-duration:6s"/>
    <circle class="s" cx="990" cy="150" r="1.1" style="animation-delay:-.2s"/><circle class="s" cx="620" cy="200" r="1" style="animation-delay:-3.3s"/>
    <circle class="s" cx="900" cy="30" r="1.3" style="animation-delay:-2.8s;animation-duration:4.6s"/><circle class="s" cx="670" cy="120" r=".9" style="animation-delay:-1.9s"/>
    <circle class="s" cx="720" cy="285" r="1.1" style="animation-delay:-.8s;animation-duration:5.4s"/><circle class="s" cx="950" cy="270" r=".9" style="animation-delay:-2.2s"/>
    <circle class="s" cx="590" cy="15" r="1" style="animation-delay:-3.6s"/><circle class="s" cx="850" cy="55" r=".9" style="animation-delay:-1.3s;animation-duration:3.8s"/>
  </g>

  <!-- light streak -->
  <line x1="830" y1="150" x2="995" y2="8" stroke="url(#streak)" stroke-width="5" stroke-linecap="round" filter="url(#b3)" opacity=".7"/>
  <line x1="830" y1="150" x2="995" y2="8" stroke="url(#streak)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- ring -->
  <g transform="translate(810 165)">
    <circle r="78" fill="none" stroke="url(#iri)" stroke-width="12" filter="url(#b14)" opacity=".75"/>
    <circle r="76" fill="#000" stroke="url(#iri)" stroke-width="6"/>
    <circle r="66" fill="none" stroke="#fff" stroke-opacity=".12"/>
    <text x="0" y="20" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="800" letter-spacing="2" fill="url(#iri)">SD</text>
  </g>

  <!-- text -->
  <g class="fu">
    <text x="60" y="140" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="4" fill="#fff" filter="url(#sh)">SURJYAVA DAS</text>
    <rect x="62" y="160" width="130" height="3" rx="1.5" fill="url(#iri)"/>
  </g>
  <text class="fu" style="animation-delay:.4s" x="62" y="200" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="1" fill="#fff" filter="url(#sh)">Software Engineer  |  AI/ML Engineer  |  Full Stack Developer</text>
</g>
<rect x="1" y="1" width="998" height="298" rx="17" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
</svg>
