<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="core" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <circle cx="150" cy="150" r="130" fill="url(#glow)">
    <animate attributeName="r" values="120;135;120" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkling stars -->
  <g fill="#E9D5FF">
    <circle cx="40" cy="60" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="90" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="250" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="240" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="18" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orbits slowly rotating -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="40s" repeatCount="indefinite"/>

    <g transform="rotate(0 150 150)">
      <ellipse cx="150" cy="150" rx="120" ry="38" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.8"/>
      <circle r="6" fill="#22D3EE">
        <animateMotion dur="6s" repeatCount="indefinite" path="M 30,150 a120,38 0 1,0 240,0 a120,38 0 1,0 -240,0"/>
      </circle>
    </g>

    <g transform="rotate(60 150 150)">
      <ellipse cx="150" cy="150" rx="120" ry="38" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.8"/>
      <circle r="6" fill="#F472B6">
        <animateMotion dur="8s" repeatCount="indefinite" path="M 30,150 a120,38 0 1,0 240,0 a120,38 0 1,0 -240,0"/>
      </circle>
    </g>

    <g transform="rotate(120 150 150)">
      <ellipse cx="150" cy="150" rx="120" ry="38" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.8"/>
      <circle r="6" fill="#FACC15">
        <animateMotion dur="10s" repeatCount="indefinite" path="M 30,150 a120,38 0 1,0 240,0 a120,38 0 1,0 -240,0"/>
      </circle>
    </g>
  </g>

  <!-- glowing core -->
  <circle cx="150" cy="150" r="28" fill="url(#core)">
    <animate attributeName="r" values="26;31;26" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
