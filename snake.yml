name: Generate Snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7C3AED&color_dots=#ebedf0,#ddd0fb,#b79cf0,#9b78e8,#7C3AED
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#2d3343,#3b2f66,#5b45a3,#8164d6,#A78BFA
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
