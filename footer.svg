<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Thanks for stopping by - Let's build something great together." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .s{animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
  .fu{animation:fu 1.4s ease-out both}
  @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.s,.fu{animation:none;opacity:.8}}
</style>
<defs>
  <clipPath id="c"><rect width="1000" height="150" rx="18"/></clipPath>
  <filter id="b28" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1400" height="550"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="b10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="b3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="sh" x="-10%" y="-30%" width="120%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".85"/></filter>
  <linearGradient id="iri" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff3b3b"/><stop offset=".17" stop-color="#ffd21a"/>
    <stop offset=".34" stop-color="#46e03c"/><stop offset=".51" stop-color="#36c8ff"/>
    <stop offset=".68" stop-color="#4a55ff"/><stop offset=".84" stop-color="#ff2fa0"/>
    <stop offset="1" stop-color="#ff3b3b"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="streak" gradientUnits="userSpaceOnUse" x1="130" y1="62" x2="430" y2="6">
    <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="dim" x1="0" y1="0" x2="1" y2="0">
    <stop offset=".25" stop-color="#000" stop-opacity="0"/><stop offset=".6" stop-color="#000" stop-opacity=".4"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
</defs>
<g clip-path="url(#c)">
  <rect width="1000" height="150" fill="#000"/>

  <!-- rainbow nebula -->
  <g filter="url(#b28)" opacity=".9">
    <ellipse cx="40" cy="20" rx="110" ry="60" fill="#ffd21a"><animateTransform attributeName="transform" type="translate" values="0 0;20 10;0 0" dur="12s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="0" cy="95" rx="90" ry="50" fill="#ff7a00"/>
    <ellipse cx="90" cy="155" rx="140" ry="45" fill="#c4000a"><animateTransform attributeName="transform" type="translate" values="0 0;30 -8;0 0" dur="14s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="230" cy="95" rx="90" ry="45" fill="#36c8ff"><animateTransform attributeName="transform" type="translate" values="0 0;15 10;0 0" dur="10s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="190" cy="40" rx="70" ry="35" fill="#2a3dff" opacity=".8"/>
    <ellipse cx="320" cy="150" rx="110" ry="40" fill="#46e03c"><animateTransform attributeName="transform" type="translate" values="0 0;-25 -6;0 0" dur="11s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="830" cy="160" rx="110" ry="40" fill="#ff2fa0" opacity=".7"/>
    <ellipse cx="980" cy="140" rx="100" ry="45" fill="#ff7a00" opacity=".7"/>
  </g>
  <rect width="1000" height="150" fill="url(#dim)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="s" cx="680" cy="20" r="1.2" style="animation-delay:-1s"/><circle class="s" cx="760" cy="125" r="1" style="animation-delay:-2s;animation-duration:5s"/>
    <circle class="s" cx="930" cy="40" r="1.3" style="animation-delay:-.5s"/><circle class="s" cx="860" cy="18" r="1" style="animation-delay:-3s;animation-duration:3.4s"/>
    <circle class="s" cx="975" cy="95" r="1.1" style="animation-delay:-1.6s"/><circle class="s" cx="720" cy="70" r=".9" style="animation-delay:-2.4s;animation-duration:6s"/>
    <circle class="s" cx="900" cy="110" r="1" style="animation-delay:-.2s"/><circle class="s" cx="630" cy="135" r="1" style="animation-delay:-3.3s"/>
    <circle class="s" cx="520" cy="14" r="1" style="animation-delay:-2.8s;animation-duration:4.6s"/><circle class="s" cx="820" cy="75" r=".9" style="animation-delay:-1.9s"/>
  </g>

  <!-- light streak -->
  <line x1="130" y1="62" x2="430" y2="6" stroke="url(#streak)" stroke-width="4" stroke-linecap="round" filter="url(#b3)" opacity=".7"/>
  <line x1="130" y1="62" x2="430" y2="6" stroke="url(#streak)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ring -->
  <g transform="translate(100 75)">
    <circle r="46" fill="none" stroke="url(#iri)" stroke-width="9" filter="url(#b10)" opacity=".75"/>
    <circle r="44" fill="#000" stroke="url(#iri)" stroke-width="5"/>
    <text x="0" y="11" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="30" font-weight="700" fill="url(#iri)">&lt;/&gt;</text>
  </g>

  <!-- text -->
  <text class="fu" x="580" y="74" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="3" fill="#fff" filter="url(#sh)">THANKS FOR STOPPING BY</text>
  <text class="fu" style="animation-delay:.4s" x="580" y="108" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="500" letter-spacing="1" fill="#fff" filter="url(#sh)">Let's build something great together.</text>
</g>
<rect x="1" y="1" width="998" height="148" rx="17" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
</svg>

